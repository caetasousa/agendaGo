root = "."
tmp_dir = "/tmp/air"

[build]
  # -tags=swagger liga a doc interativa em http://localhost:8080/swagger/.
  # Ela é opt-in por build tag e NÃO entra na imagem de produção (ver
  # config/swagger_desligado.go); é aqui, no ambiente de desenvolvimento, que
  # ela é ligada.
  cmd = "go build -tags=swagger -o /tmp/air/api ./cmd/api/main.go"
  bin = "/tmp/air/api"
  full_bin = "/tmp/air/api"
  include_ext = ["go"]
  exclude_dir = ["docs", "test", "migrations"]
  delay = 1000

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
