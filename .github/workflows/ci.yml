name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite republicar as imagens e reimplantar sem precisar de um commit
  # novo (útil para reaplicar um deploy que falhou por causa do servidor).
  workflow_dispatch:
  # Varredura semanal de vulnerabilidades. Sem isto, o job `seguranca` só roda
  # quando alguém commita: uma CVE publicada numa semana sem push passaria
  # despercebida até o próximo commit. Segunda, 9h UTC (6h em Brasília).
  schedule:
    - cron: '0 9 * * 1'

# Cancela execuções antigas do mesmo ref quando um novo push chega — mas só
# em pull request. Na main não: `cancel-in-progress` é de nível de workflow e
# alcança TODOS os jobs do run anterior, inclusive o `implantar`. Um segundo
# push durante o deploy mataria o job no meio do caminho — entre o `pull` e o
# `up -d`, deixando a stack em versões misturadas, ou durante a reescrita do
# crontab, que é um `crontab -l | ... | crontab -` e truncaria o agendamento
# do backup sem avisar. Definir `concurrency` no job não protege disso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Menor privilégio por padrão: o GITHUB_TOKEN só lê o repositório. Os jobs que
# precisam de mais (publicar no GHCR, enviar SARIF para a aba Security) elevam
# o que precisam, e só eles.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, vet, testes + integração)
    runs-on: ubuntu-latest
    # O job leva ~1 min. Sem teto explícito o padrão do GitHub é 360 min, e um
    # passo travado seguraria o grupo de concorrência por 6 horas.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/docker-hub-login
        with:
          usuario: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # main.go importa o pacote agendago/docs (spec do Swagger), gerado por
      # swag e fora do versionamento. Precisa ser gerado antes de compilar,
      # como o Dockerfile faz no boot.
      - name: gera docs do swagger
        working-directory: backend
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g cmd/api/main.go -o docs

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: build
        working-directory: backend
        run: go build ./...

      # Baixa a imagem ANTES dos testes: sem isto o Testcontainers a buscaria
      # no meio da suíte, e um pull barrado pela cota derrubaria os testes de
      # integração todos juntos.
      - name: baixa a imagem do Postgres
        uses: ./.github/actions/docker-pull
        with:
          imagem: postgres:16-alpine

      # Roda os testes rápidos e os de integração (Testcontainers sobe um
      # Postgres efêmero via o Docker já presente no runner).
      #
      # Ryuk é o container que o Testcontainers usa para faxinar o que sobrar;
      # ele mora no Docker Hub e seria mais um pull sujeito à mesma limitação.
      # O runner é efêmero e os testes já encerram os containers no t.Cleanup,
      # então aqui ele não tem o que fazer.
      #
      # `-race` porque a API serve requisições concorrentes (rate limiter e
      # envio de email compartilham estado entre goroutines): corrida de dados
      # não quebra o teste sem o detector, só aparece em produção sob carga.
      - name: testes
        working-directory: backend
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: go test -race -tags=integration ./...

  frontend:
    name: Frontend (svelte-check + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        working-directory: frontend
        run: npm ci

      - name: svelte-check
        working-directory: frontend
        run: npm run check

      - name: testes unitários
        working-directory: frontend
        run: npm run test:unit

  # Vulnerabilidades nas dependências do código. govulncheck cobre o Go (só o
  # que é realmente alcançável a partir do binário); npm audit cobre o JS —
  # travando só nas dependências que vão pra imagem (--omit=dev), porque uma
  # CVE no Vite ou no Playwright não roda em produção e não deveria barrar um
  # deploy de correção. A camada de sistema operacional é do job irmão,
  # `seguranca-imagens`, que nenhum dos dois enxerga daqui.
  seguranca-codigo:
    name: Vulnerabilidades (dependências do código)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # Mesmo motivo do job `backend`: main.go importa agendago/docs, gerado
      # por swag e fora do versionamento. Sem gerar antes, o govulncheck não
      # consegue carregar os pacotes e falha antes de analisar qualquer coisa.
      - name: gera docs do swagger
        working-directory: backend
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g cmd/api/main.go -o docs

      # Versão fixa, como a do swag: com @latest uma release nova do
      # govulncheck pode reprovar um commit que não mexeu em nada, e o build de
      # ontem deixa de ser reproduzível hoje. A varredura semanal já garante
      # que CVEs novas apareçam sem depender de atualizar a ferramenta.
      - name: govulncheck (backend)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install (frontend)
        working-directory: frontend
        run: npm ci

      - name: npm audit — dependências de produção (trava o CI)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit — relatório completo (não trava)
        working-directory: frontend
        if: always()
        run: npm audit || true

  # Varredura das imagens prontas (sistema base + libs de SO), que o
  # govulncheck e o npm audit não enxergam. Uma perna por imagem: as TRÊS que
  # vão para produção, inclusive a de migrations — ela roda na VPS com acesso
  # ao banco e antes ficava de fora da varredura.
  seguranca-imagens:
    name: Vulnerabilidades (imagens)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Necessário para publicar os achados do Trivy na aba Security.
      security-events: write
    strategy:
      # Uma imagem reprovada não deve esconder o resultado das outras duas.
      fail-fast: false
      matrix:
        include:
          - imagem: agendago-api
            contexto: ./backend
            dockerfile: ./backend/Dockerfile.prod
          - imagem: agendago-web
            contexto: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
          - imagem: agendago-migrations
            contexto: ./backend
            dockerfile: ./backend/Dockerfile.migrations
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/docker-hub-login
        with:
          usuario: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      # O buildx sobe um container do BuildKit vindo do Docker Hub, e o pull
      # anônimo falha quando o limite por IP do runner estoura.
      - name: baixa a imagem do BuildKit
        uses: ./.github/actions/docker-pull
        with:
          imagem: moby/buildkit:buildx-stable-1

      - uses: docker/setup-buildx-action@v3

      # Antes isto era `docker build` puro, sem cache: a mesma imagem era
      # compilada aqui e de novo em `publicar-imagens`. Usando buildx com o
      # MESMO scope de cache, a build daqui alimenta a de lá (que roda depois,
      # via needs) e nenhuma das duas recompila Go ou npm à toa.
      # `load: true` deixa a imagem no daemon local para o Trivy varrer.
      - name: build da imagem (só para varrer, sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.imagem }}:scan
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}

      # Relatório legível no log, com HIGH junto. Nunca trava: HIGH em imagem
      # base costuma não ter correção disponível, e barrar o deploy nisso
      # transformaria o portão em ruído que se aprende a ignorar.
      - name: Trivy — relatório (HIGH + CRITICAL, não trava)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.imagem }}:scan
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # No log o achado se perde no scroll e desaparece no run seguinte; em
      # SARIF ele vai para a aba Security com histórico, deduplicação e a data
      # em que apareceu. `category` distinta por imagem: sem isso, a última
      # perna da matriz sobrescreveria o resultado das anteriores.
      - name: Trivy — SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.imagem }}:scan
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: sarif
          output: trivy-${{ matrix.imagem }}.sarif

      - name: publica o SARIF na aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.imagem }}.sarif
          category: trivy-${{ matrix.imagem }}

      # O portão vem por último, para que o relatório e o SARIF subam mesmo
      # quando ele reprova — é justamente na execução que falha que o registro
      # importa mais.
      - name: Trivy — portão (trava em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.imagem }}:scan
          severity: 'CRITICAL'
          exit-code: '1'

  e2e:
    name: E2E (Playwright sobre o docker-compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/docker-hub-login
        with:
          usuario: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Instala as dependências e o browser ANTES de subir o compose: o serviço
      # web monta ./frontend e roda npm install como root no container, o que
      # deixaria frontend/node_modules com dono root e faria o npm ci do runner
      # (não-root) falhar com EACCES. Instalando primeiro, a pasta pertence ao
      # runner, que é quem executa o playwright test.
      - name: instala dependências e browser do Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # O compose consome o .env; o .example já aponta para o Mailpit (nenhum
      # email real é enviado). Desliga TODO rate limit (a regex pega os tetos
      # novos automaticamente) porque a suíte faz centenas de requisições do
      # mesmo IP em poucos minutos, e fixa as credenciais do admin nos valores
      # que os specs de admin esperam (e2e/admin.spec.ts).
      - name: prepara .env
        run: |
          cp .env.example .env
          sed -i -E 's/^(RATE_LIMIT_[A-Z_]+)=.*/\1=0/' .env
          sed -i 's/^ADMIN_EMAIL=.*/ADMIN_EMAIL=admin@agendago.dev/' .env
          sed -i 's/^ADMIN_SENHA=.*/ADMIN_SENHA=admin12345/' .env

      # O override isola o node_modules do container web num volume anônimo,
      # para ele não sobrescrever (como root) as dependências que o runner
      # instalou e que o playwright test usa.
      - name: sobe a stack (Postgres, migrations, API, web, Mailpit)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      # Espera a API e o frontend responderem antes de disparar os testes.
      - name: aguarda a stack ficar pronta
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health >/dev/null \
              && curl -sf http://localhost:5173 >/dev/null; then
              echo "stack pronta"; exit 0
            fi
            sleep 2
          done
          echo "stack não ficou pronta a tempo"; exit 1

      - name: testes E2E
        working-directory: frontend
        run: npx playwright test

      # Em falha, os logs dos containers ajudam a diagnosticar sem reproduzir.
      - name: logs do compose (em falha)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      # Sem isto, um E2E que falha só no CI deixa apenas texto: o trace do
      # Playwright (DOM, rede e screenshot a cada passo) é o que evita ter que
      # reproduzir o ambiente inteiro na mão para entender a quebra.
      - name: guarda o relatório e os traces do Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: derruba a stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # Publica as imagens de produção no GHCR. É o que permite que a VPS rode a
  # stack com apenas docker-compose.prod.yml + Caddyfile + .env: ela dá `pull`,
  # nunca `build` (uma VPS de 1 vCPU levaria minutos compilando Go e npm).
  # Só roda em push na main e depois que todos os testes passaram.
  publicar-imagens:
    name: Publica imagens no GHCR
    # A varredura semanal (schedule) não pode disparar deploy: ela roda sem
    # commit novo, e reimplantar produção sozinho toda segunda não é o objetivo.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e, seguranca-codigo, seguranca-imagens]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - imagem: agendago-api
            contexto: ./backend
            dockerfile: ./backend/Dockerfile.prod
          - imagem: agendago-web
            contexto: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
          - imagem: agendago-migrations
            contexto: ./backend
            dockerfile: ./backend/Dockerfile.migrations
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/docker-hub-login
        with:
          usuario: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Faz o "Booting builder" do buildx encontrar a imagem no cache local em
      # vez de ir à rede e esbarrar na cota por IP.
      - name: baixa a imagem do BuildKit
        uses: ./.github/actions/docker-pull
        with:
          imagem: moby/buildkit:buildx-stable-1

      - uses: docker/setup-buildx-action@v3

      - name: login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Duas tags: `latest` (o que o compose de produção puxa por padrão) e o
      # SHA do commit, que permite fixar/rollback via IMAGE_TAG no .env.
      - name: build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Hostinger KVM é x86; buildar só amd64 mantém o CI rápido.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}

  # Deploy contínuo na VPS. Não sobe binário nem código-fonte: as imagens já
  # estão no GHCR, então o servidor só recebe os dois arquivos de configuração
  # da stack (o .env fica no host, com os segredos) e a ordem de puxar a
  # versão nova. É a mesma sequência do deploy manual documentado.
  #
  # Segredos necessários no repositório (Settings → Secrets and variables):
  #   VPS_HOST         IP ou hostname do servidor
  #   VPS_USER         usuário SSH (não-root, no grupo docker)
  #   VPS_SSH_KEY      chave PRIVADA de deploy (a pública vai no authorized_keys)
  #   VPS_PORT         opcional, padrão 22
  #   VPS_KNOWN_HOSTS  saída de `ssh-keyscan -H HOST` (fixa a identidade do
  #                    servidor). Obrigatório quando VPS_HOST existe.
  # E a variável DOMINIO (aba Variables) para a verificação pós-deploy.
  implantar:
    name: Deploy na VPS
    # A varredura semanal (schedule) não pode disparar deploy: ela roda sem
    # commit novo, e reimplantar produção sozinho toda segunda não é o objetivo.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: publicar-imagens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Sem os segredos o job passa sem fazer nada, em vez de falhar em
      # vermelho — o repositório funciona antes de a VPS existir.
      - name: verifica se o deploy está configurado
        id: cfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST não configurado — deploy ignorado."
          fi

      - name: prepara a chave SSH
        if: steps.cfg.outputs.configurado == 'true'
        env:
          CHAVE: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORTA: ${{ secrets.VPS_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Antes havia um fallback para `ssh-keyscan` quando o segredo não
          # existia — o que aceitava a identidade de quem respondesse, a cada
          # deploy, e entregava a chave de deploy junto. Como a VPS já está de
          # pé, fixar a identidade é barato e o caso ausente vira falha.
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS não configurado. Gere com: ssh-keyscan -p $PORTA -H $HOST"
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Mantém compose e Caddyfile do servidor iguais aos do repositório: sem
      # isto, mudar o roteamento ou adicionar um serviço exigiria copiar os
      # arquivos na mão. O .env NUNCA é enviado — ele mora só no host.
      - name: sincroniza a configuração da stack
        if: steps.cfg.outputs.configurado == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USER }}
          PORTA: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -4 -o ConnectTimeout=15 -i ~/.ssh/id_deploy -p "$PORTA" "$USUARIO@$HOST" 'mkdir -p ~/agendago/scripts'
          scp -4 -o ConnectTimeout=15 -i ~/.ssh/id_deploy -P "$PORTA" \
            docker-compose.prod.yml Caddyfile "$USUARIO@$HOST:~/agendago/"
          # O script de backup também é versionado: assim ele chega na VPS
          # revisado, em vez de virar um arquivo solto que ninguém sabe de onde veio.
          scp -4 -o ConnectTimeout=15 -i ~/.ssh/id_deploy -P "$PORTA" \
            scripts/backup.sh "$USUARIO@$HOST:~/agendago/scripts/"
          ssh -4 -o ConnectTimeout=15 -i ~/.ssh/id_deploy -p "$PORTA" "$USUARIO@$HOST" 'chmod +x ~/agendago/scripts/backup.sh'

      # Fixa a tag no SHA deste commit: o servidor sobe exatamente o artefato
      # que passou nos testes, não um `latest` que pode ter mudado no meio.
      #
      # `--quiet` no pull porque o progresso por camada, sem terminal para
      # reescrever a linha, vira MILHARES de linhas de "Downloading 10.49MB" no
      # log — e o erro, quando existe, se perde no meio delas. O teto de tempo
      # do job é que protege contra um pull travado, não a barra de progresso.
      - name: puxa as imagens e sobe a stack
        if: steps.cfg.outputs.configurado == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USER }}
          PORTA: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -4 -o ConnectTimeout=15 -i ~/.ssh/id_deploy -p "$PORTA" "$USUARIO@$HOST" \
            "cd ~/agendago \
             && IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml pull --quiet \
             && IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d \
             && docker image prune -f"

      # Agenda o backup diário. Deixar isso manual seria o elo fraco da
      # estratégia: um cron esquecido não avisa, e a descoberta viria no dia em
      # que o backup fosse necessário.
      #
      # Idempotente: reescreve apenas a linha do agendago, preservando qualquer
      # outra entrada do crontab do usuário.
      - name: agenda o backup diário do banco
        if: steps.cfg.outputs.configurado == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USER }}
          PORTA: ${{ secrets.VPS_PORT || '22' }}
          # Horário configurável por variável do repositório, sem mexer no código.
          AGENDA: ${{ vars.BACKUP_CRON || '0 3 * * *' }}
        run: |
          ssh -4 -o ConnectTimeout=15 -i ~/.ssh/id_deploy -p "$PORTA" "$USUARIO@$HOST" "
            mkdir -p \$HOME/backups
            ( crontab -l 2>/dev/null | grep -v 'agendago/scripts/backup.sh'
              echo '$AGENDA \$HOME/agendago/scripts/backup.sh >> \$HOME/backups/backup.log 2>&1'
            ) | crontab -
          "
          # O cron do Debian/Ubuntu não suporta CRON_TZ: a expressão é sempre
          # interpretada no fuso do HOST. Imprimir os dois juntos evita o erro
          # silencioso de agendar "1h" achando que é horário de Brasília num
          # servidor em UTC.
          # Lê o fuso do timedatectl, não de /etc/timezone: esse arquivo legado
          # não é atualizado por `timedatectl set-timezone` em toda imagem de
          # Ubuntu, e reportaria o fuso antigo num servidor já corrigido.
          echo 'agendamento efetivo no servidor:'
          ssh -4 -o ConnectTimeout=15 -i ~/.ssh/id_deploy -p "$PORTA" "$USUARIO@$HOST" \
            'printf "  fuso do servidor: %s (agora: %s)\n" "$(timedatectl show --property=Timezone --value 2>/dev/null || readlink -f /etc/localtime)" "$(date "+%F %T %Z")"; printf "  crontab: %s\n" "$(crontab -l | grep backup.sh)"'

      # Deploy sem verificação é deploy no escuro: se a aplicação não responder,
      # o job falha e o erro aparece no commit.
      #
      # Checa a API e a página inicial. Só /api/health deixava passar um deploy
      # em que o container `web` subiu quebrado: a API responde, o job fica
      # verde e quem descobre é o usuário.
      - name: verifica se a aplicação respondeu
        if: steps.cfg.outputs.configurado == 'true' && vars.DOMINIO != ''
        env:
          DOMINIO: ${{ vars.DOMINIO }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://$DOMINIO/api/health" >/dev/null \
              && curl -fsS -o /dev/null "https://$DOMINIO/"; then
              echo "aplicação no ar (API e frontend)"; exit 0
            fi
            sleep 5
          done
          echo "a aplicação não respondeu em /api/health e/ou / após o deploy"
          exit 1
