# Atualização automática de dependências. O CI já sabe apontar vulnerabilidade
# (job `seguranca`), mas apontar não corrige: sem alguém abrindo o PR, a
# dependência envelhece até virar incidente. O Dependabot é esse alguém.
#
# Tudo agrupado num PR por ecossistema. Sem agrupar, a primeira execução abriu
# 12 PRs de uma vez — um por dependência —, e uma enxurrada dessas vira ruído
# que ninguém revisa. Quatro PRs por semana cabem na rotina.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      go:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - '*'

  # As imagens base do Dockerfile de produção (golang, node, alpine) e a do
  # Flyway — é onde mora a maior parte do que o Trivy acusa.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      imagens-base:
        patterns:
          - '*'
