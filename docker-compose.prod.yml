# Stack de PRODUÇÃO: um único host rodando tudo atrás do Caddy, que termina o
# TLS (HTTPS automático via Let's Encrypt) e serve frontend e API na MESMA
# origem — Caddy roteia /api/* para a API e todo o resto para o frontend. Como
# é uma origem só, o cookie de sessão (SameSite=Lax) funciona sem mudança de
# código, e não há CORS entre front e API.
#
# Diferente do docker-compose.yml (dev): imagens de produção prontas, sem hot
# reload, sem Mailpit (usa SMTP real), Postgres sem porta pública.
#
# As imagens são buildadas pelo CI e publicadas no GHCR — este arquivo NÃO
# builda nada. Por isso o host de produção só precisa de três arquivos
# (docker-compose.prod.yml, Caddyfile e .env), nunca do código-fonte.
#
# Sobe com:  docker compose -f docker-compose.prod.yml pull && \
#            docker compose -f docker-compose.prod.yml up -d
# Consome as variáveis de um arquivo .env (veja .env.prod.example).

# Rotação de log (driver json-file): sem isto, o log do Docker cresce sem
# limite e enche o disco do host ao longo do tempo. Mantém no máximo 3 arquivos
# de 10 MB por serviço.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # O entrypoint do Postgres sobe como root e larga privilégio para o usuário
    # `postgres`: por isso ele não pode ficar sem NENHUMA capability. Estas cinco
    # são o mínimo para essa troca de usuário e para ajustar o dono do datadir.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 512
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # sem `ports`: o banco só é alcançável pela rede interna do compose
    # (API e job de migration), nunca pela internet.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Job pontual: aplica as migrations e sai. A API só sobe depois que ele
  # termina com sucesso (depends_on: service_completed_successfully). Os .sql
  # vêm dentro da imagem (backend/Dockerfile.migrations), não de um bind mount.
  flyway:
    image: ${IMAGE_REPO:-ghcr.io/caetasousa}/agendago-migrations:${IMAGE_TAG:-latest}
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_REPO:-ghcr.io/caetasousa}/agendago-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # Sem `healthcheck` aqui de propósito: a imagem já traz o dela
    # (backend/Dockerfile.prod), batendo em /ready. Declarar de novo criaria duas
    # definições para manter em sincronia — `docker compose ps` mostra o estado
    # de saúde do mesmo jeito.
    # Binário estático rodando como usuário sem privilégio: não precisa de
    # capability nenhuma nem de escrever em disco. read_only impede que um
    # comprometimento deixe qualquer coisa gravada no container.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    # Teto, não reserva. Argon2id usa ~19 MiB por hash simultâneo; suba se o
    # log mostrar OOM em rajada de login.
    mem_limit: 384m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      # Usuário da APLICAÇÃO: só DML, sem poder criar/alterar/derrubar tabela.
      # Sem DB_USER definido, cai no dono do banco (comportamento antigo) — ver
      # scripts/criar-usuario-app.sh e docs/producao.md.
      DB_USER: ${DB_USER:-${POSTGRES_USER}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD}}
      # Limites do pool. Ausentes, valem os padrões do projeto — que já são uma
      # decisão, ao contrário do padrão do pgx (max(4, núcleos), ou seja 4 numa
      # VPS de 1 vCPU).
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_LIFETIME_MIN: ${DB_MAX_CONN_LIFETIME_MIN:-60}
      DB_MAX_CONN_IDLE_MIN: ${DB_MAX_CONN_IDLE_MIN:-30}
      DB_HEALTHCHECK_SEC: ${DB_HEALTHCHECK_SEC:-60}
      # production liga o atributo Secure do cookie de sessão (exige HTTPS,
      # que o Caddy fornece).
      APP_ENV: production
      # Origem pública do frontend: usada no CORS E como base dos links nos
      # emails (recuperação de senha, cadastro, cancelamento). Como front e API
      # ficam na mesma origem atrás do Caddy, é a URL raiz do site.
      FRONTEND_ORIGIN: https://${DOMINIO}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      # Rate limiting. NÃO deixe nenhum em 0 em produção — cada um cobre um
      # ângulo: por IP (anônimo), por conta (brute-force com IPs rotativos) e
      # por sessão (abuso depois do login).
      RATE_LIMIT_LOGIN_POR_MINUTO: ${RATE_LIMIT_LOGIN_POR_MINUTO:-10}
      RATE_LIMIT_CONVIDADO_POR_MINUTO: ${RATE_LIMIT_CONVIDADO_POR_MINUTO:-10}
      RATE_LIMIT_PUBLICO_POR_MINUTO: ${RATE_LIMIT_PUBLICO_POR_MINUTO:-60}
      RATE_LIMIT_LOGIN_POR_CONTA: ${RATE_LIMIT_LOGIN_POR_CONTA:-5}
      RATE_LIMIT_AUTENTICADO_POR_MINUTO: ${RATE_LIMIT_AUTENTICADO_POR_MINUTO:-60}
      # SMTP real (ex.: Brevo). Vazio desliga o envio (emails só são logados).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE}
      EMAIL_REMETENTE_NOME: ${EMAIL_REMETENTE_NOME:-agendaGo}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      # Login social com Google: vazio desliga o recurso
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
    depends_on:
      flyway:
        condition: service_completed_successfully

  # A imagem já vem com PUBLIC_API_URL=/api assado no build (relativo, portanto
  # independente do domínio — o Caddy serve front e API na mesma origem).
  web:
    image: ${IMAGE_REPO:-ghcr.io/caetasousa}/agendago-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      # adapter-node atrás de proxy: conhece a origem pública e confia nos
      # cabeçalhos X-Forwarded-* do Caddy.
      ORIGIN: https://${DOMINIO}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    # Precisa só de NET_BIND_SERVICE, para abrir as portas 80 e 443 (abaixo de
    # 1024). Escreve em /data (certificados), então não pode ser read_only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    mem_limit: 128m
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados (persistem entre restarts)
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
